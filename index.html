<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>রিটেইলার পোর্টাল</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --blue: #1a56db;
            --blue-dark: #1241b0;
            --blue-light: #e8f0ff;
            --green: #0d9f6e;
            --green-light: #e6f9f2;
            --red: #e53935;
            --red-light: #fdecea;
            --amber: #f59e0b;
            --amber-light: #fffbeb;
            --surface: #f4f6fb;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-2: #475569;
            --text-3: #94a3b8;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 4px 24px rgba(30,41,59,0.10);
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: var(--surface);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 0 0 40px;
            color: var(--text);
        }

        /* ── TOP BAR ── */
        .topbar {
            width: 100%;
            background: var(--blue);
            padding: 18px 20px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .topbar-title {
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.01em;
        }
        .topbar-sub {
            color: rgba(255,255,255,0.65);
            font-size: 12px;
            margin-top: 1px;
        }
        .topbar-icon {
            width: 38px; height: 38px;
            background: rgba(255,255,255,0.18);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .logout-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 99px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .logout-btn:hover { background: rgba(255,255,255,0.25); }

        /* ── MAIN WRAP ── */
        .wrap {
            width: 100%;
            max-width: 440px;
            padding: 20px 16px 0;
        }

        /* ── LOGIN CARD ── */
        .login-card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            margin-top: 12px;
        }
        .login-hero {
            background: linear-gradient(135deg, var(--blue) 0%, #2563eb 100%);
            padding: 32px 24px 28px;
            text-align: center;
        }
        .login-hero .icon-wrap {
            width: 64px; height: 64px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px;
            margin: 0 auto 14px;
        }
        .login-hero h1 { color: #fff; font-size: 22px; font-weight: 700; }
        .login-hero p { color: rgba(255,255,255,0.72); font-size: 13px; margin-top: 4px; }
        .login-body { padding: 24px; }

        /* ── FORM ELEMENTS ── */
        .field { margin-bottom: 14px; }
        .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-2);
            margin-bottom: 6px;
        }
        .input-wrap { position: relative; }
        .input-wrap .icon {
            position: absolute;
            left: 13px; top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            color: var(--text-3);
            pointer-events: none;
        }
        .input-wrap input,
        .input-wrap select,
        input[type="text"],
        input[type="tel"],
        input[type="password"],
        select {
            width: 100%;
            padding: 11px 14px 11px 40px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-family: inherit;
            color: var(--text);
            background: #f8fafc;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
            -webkit-appearance: none;
        }
        .input-wrap input:focus,
        .input-wrap select:focus,
        input:focus, select:focus {
            border-color: var(--blue);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(26,86,219,0.12);
        }
        select { cursor: pointer; }

        /* ── BUTTONS ── */
        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.15s, opacity 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: var(--blue); color: #fff; }
        .btn-primary:hover { background: var(--blue-dark); }
        .btn-primary:disabled { background: var(--text-3); cursor: not-allowed; transform: none; }
        .btn-ghost {
            background: transparent;
            color: var(--red);
            border: 1.5px solid #fca5a5;
            margin-top: 10px;
            font-size: 14px;
        }
        .btn-ghost:hover { background: var(--red-light); }

        /* ── ERROR BOX ── */
        .error-box {
            display: none;
            background: var(--red-light);
            border: 1px solid #fca5a5;
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-size: 13px;
            color: var(--red);
            margin-bottom: 12px;
            font-weight: 600;
        }
        .error-box.show { display: flex; align-items: center; gap: 8px; }

        /* ── ANNOUNCEMENT ── */
        .announce {
            background: var(--amber-light);
            border: 1.5px solid #fde68a;
            border-radius: var(--radius-sm);
            padding: 11px 14px;
            font-size: 13px;
            font-weight: 600;
            color: #92400e;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 16px;
        }
        .announce .icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

        /* ── STATS ── */
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .stat-card {
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 8px 10px;
            text-align: center;
        }
        .stat-card .num {
            font-size: 26px;
            font-weight: 800;
            line-height: 1;
        }
        .stat-card .lbl {
            font-size: 11px;
            color: var(--text-3);
            margin-top: 4px;
            font-weight: 500;
        }
        .stat-card.target .num { color: var(--blue); }
        .stat-card.done .num { color: var(--green); }
        .stat-card.remaining .num { color: var(--red); }

        /* ── PROGRESS ── */
        .progress-wrap { margin-bottom: 18px; }
        .progress-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-3);
            margin-bottom: 6px;
            font-weight: 600;
        }
        .progress-bar {
            height: 8px;
            background: #e2e8f0;
            border-radius: 99px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--green) 0%, #34d399 100%);
            border-radius: 99px;
            transition: width 0.6s ease;
        }
        .goal-badge {
            display: none;
            background: var(--green-light);
            border: 1px solid #6ee7b7;
            border-radius: 99px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 700;
            color: var(--green);
            margin-top: 8px;
            text-align: center;
        }
        .goal-badge.show { display: block; }

        /* ── SECTION TITLE ── */
        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 20px 0 12px;
        }

        /* ── SESSION COUNT ── */
        .session-count {
            background: var(--blue-light);
            border-radius: 99px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 700;
            color: var(--blue);
            display: inline-block;
            margin-top: 10px;
        }

        /* ── FORM CARD ── */
        .form-card {
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 2px 8px rgba(30,41,59,0.06);
        }

        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 18px 0;
        }

        /* ── HIDDEN ── */
        .hidden { display: none !important; }

        /* ── LOGIN INPUT FOCUS ── */
        #r_id:focus, #r_pass:focus {
            border-color: #3b82f6 !important;
            background: #fff !important;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15) !important;
        }
        #loginBtn:hover:not(:disabled) { background: #1d4ed8 !important; }
        #loginBtn:active { transform: scale(0.98); }
        #loginBtn:disabled { background: #93c5fd !important; cursor: not-allowed; }

        /* ── FOOTER ── */
        .footer {
            text-align: center;
            font-size: 12px;
            color: var(--text-3);
            margin-top: 24px;
            padding: 0 16px;
        }
    </style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage" style="width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#dbeafe 0%,#eff6ff 45%,#fef9f0 100%);padding:32px 16px;">

    <div style="width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;">

        <!-- Brand -->
        <div style="text-align:center;margin-bottom:28px;">
            <div style="width:72px;height:72px;background:linear-gradient(135deg,#3b82f6 0%,#2563eb 100%);border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 8px 24px rgba(37,99,235,0.30);">
                <svg viewBox="0 0 24 24" fill="white" width="36" height="36"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            </div>
            <h1 style="font-size:26px;font-weight:700;color:#1e293b;margin:0 0 6px;">রিটেইলার পোর্টাল</h1>
            <p style="font-size:14px;color:#94a3b8;margin:0;">আপনার অ্যাকাউন্টে প্রবেশ করুন</p>
        </div>

        <!-- Card -->
        <div style="background:#fff;border-radius:20px;box-shadow:0 8px 32px rgba(30,41,59,0.10);padding:28px 24px;width:100%;">
            <div class="error-box" id="loginError" style="margin-bottom:14px;">
                <span>⚠️</span><span id="loginErrorMsg"></span>
            </div>

            <div class="field">
                <label style="font-size:14px;font-weight:600;color:#475569;display:block;margin-bottom:8px;">রিটেইলার আইডি</label>
                <input type="text" id="r_id" placeholder="আপনার আইডি লিখুন" autocomplete="off"
                    style="width:100%;padding:13px 16px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:15px;font-family:inherit;color:#1e293b;background:#f8fafc;outline:none;box-sizing:border-box;">
            </div>
            <div class="field">
                <label style="font-size:14px;font-weight:600;color:#475569;display:block;margin-bottom:8px;">পাসওয়ার্ড</label>
                <input type="password" id="r_pass" placeholder="পাসওয়ার্ড লিখুন" autocomplete="current-password"
                    style="width:100%;padding:13px 16px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:15px;font-family:inherit;color:#1e293b;background:#f8fafc;outline:none;box-sizing:border-box;">
            </div>
            <button id="loginBtn" onclick="login()"
                style="width:100%;padding:14px;background:#2563eb;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:6px;transition:background 0.2s;">
                লগইন করুন
            </button>
        </div>

        <div style="text-align:center;font-size:12px;color:#94a3b8;margin-top:20px;">© ২০২৬ রিটেইলার ম্যানেজমেন্ট সিস্টেম &nbsp;·&nbsp; <span style="color:#3b82f6;font-weight:600;">v1.0.0</span></div>
    </div>
</div>

<!-- DASHBOARD PAGE -->
<div id="dashPage" class="hidden" style="width:100%;display:flex;flex-direction:column;align-items:center;">
    <!-- Top Bar -->
    <div class="topbar">
        <div>
            <div class="topbar-title" id="welcomeName">স্বাগতম</div>
            <div class="topbar-sub" id="retailerIdShow">ID: —</div>
        </div>
        <button class="logout-btn" onclick="logout()">লগআউট</button>
    </div>

    <div class="wrap">
        <!-- Announcement -->
        <div class="announce" id="announceBox" style="margin-top:16px;">
            <span class="icon">📣</span>
            <span id="announceText">স্বাগতম!</span>
        </div>

        <!-- Stats -->
        <div class="stats-row">
            <div class="stat-card target">
                <div class="num" id="targetVal">0</div>
                <div class="lbl">টার্গেট</div>
            </div>
            <div class="stat-card done">
                <div class="num" id="submittedCount">0</div>
                <div class="lbl">জমা হয়েছে</div>
            </div>
            <div class="stat-card remaining">
                <div class="num" id="remainingCount">0</div>
                <div class="lbl">বাকি আছে</div>
            </div>
        </div>

        <!-- Progress -->
        <div class="progress-wrap">
            <div class="progress-meta">
                <span>অগ্রগতি</span>
                <span id="progressPct">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width:0%"></div>
            </div>
            <div class="goal-badge" id="goalBadge">🎉 লক্ষ্যমাত্রা অর্জিত!</div>
        </div>

        <!-- Form Card -->
        <div class="section-title">নতুন নম্বর জমা দিন</div>
        <div class="form-card">
            <div class="field">
                <label id="brandLabel">ব্র্যান্ড নির্বাচন করুন</label>
                <div class="input-wrap">
                    <span class="icon">🏷️</span>
                    <select id="brand_select" style="padding-left:40px;"></select>
                </div>
            </div>

            <hr class="divider">

            <div class="field">
                <label>📱 মোবাইল নম্বর</label>
                <div class="input-wrap">
                    <span class="icon">📱</span>
                    <input type="tel" id="customer_phone" placeholder="01XXXXXXXXX" maxlength="11">
                </div>
            </div>

            <div class="field">
                <label>ভোক্তার নাম <span style="font-weight:400;color:var(--text-3)">(ঐচ্ছিক)</span></label>
                <div class="input-wrap">
                    <span class="icon">👤</span>
                    <input type="text" id="consumer_name" placeholder="ভোক্তার নাম লিখুন">
                </div>
            </div>

            <div class="error-box" id="submitError">
                <span>⚠️</span><span id="submitErrorMsg"></span>
            </div>

            <button class="btn btn-primary" id="submitBtn" onclick="submitData()" style="margin-top:4px;">
                ✅ জমা দিন
            </button>
        </div>

        <div style="text-align:center;margin-top:12px;">
            <span class="session-count">✅ এই সেশনে জমা হয়েছে <span id="sessionCount">0</span></span>
        </div>

        <button class="btn btn-ghost" onclick="refreshStatus()" style="margin-top:14px;">
            🔄 স্ট্যাটাস রিফ্রেশ করুন
        </button>

        <div class="footer">© ২০২৬ রিটেইলার ম্যানেজমেন্ট সিস্টেম</div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://retailer-app-live-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let user = null;
    let sessionSubmits = 0;
    let unsubscribe = null;

    // Auto-login from localStorage
    window.onload = () => {
        const saved = localStorage.getItem('retailerUser');
        if (saved) {
            try { user = JSON.parse(saved); showDashboard(); } catch(e) { localStorage.removeItem('retailerUser'); }
        }
    };

    function showError(id, msgId, msg) {
        const box = document.getElementById(id);
        document.getElementById(msgId).innerText = msg;
        box.classList.add('show');
        setTimeout(() => box.classList.remove('show'), 4000);
    }

    function login() {
        const id = document.getElementById('r_id').value.trim();
        const pass = document.getElementById('r_pass').value.trim();
        if (!id || !pass) return showError('loginError','loginErrorMsg','আইডি এবং পাসওয়ার্ড দিন');

        const btn = document.getElementById('loginBtn');
        btn.disabled = true; btn.innerHTML = '⏳ যাচাই করা হচ্ছে...';

        db.ref('retailers/' + id).once('value').then((snap) => {
            const data = snap.val();
            if (data && String(data.password) === String(pass)) {
                user = { ...data, id };
                localStorage.setItem('retailerUser', JSON.stringify(user));
                showDashboard();
            } else {
                showError('loginError', 'loginErrorMsg', 'ভুল আইডি বা পাসওয়ার্ড। আবার চেষ্টা করুন।');
                btn.disabled = false; btn.innerHTML = 'লগইন করুন';
            }
        }).catch(err => {
            showError('loginError', 'loginErrorMsg', 'সংযোগ ত্রুটি: ' + err.message);
            btn.disabled = false; btn.innerHTML = 'লগইন করুন';
        });
    }

    function showDashboard() {
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('dashPage').classList.remove('hidden');

        document.getElementById('welcomeName').innerText = user.name || user.id;
        document.getElementById('retailerIdShow').innerText = 'ID: ' + user.id;
        document.getElementById('announceText').innerText = user.announce || 'স্বাগতম!';
        document.getElementById('targetVal').innerText = user.target || 0;
        document.getElementById('remainingCount').innerText = user.target || 0;
        document.getElementById('brandLabel').innerText = user.fieldLabel || 'ব্র্যান্ড নির্বাচন করুন';

        const select = document.getElementById('brand_select');
        select.innerHTML = '<option value="">নির্বাচন করুন</option>';
        if (user.brands) {
            user.brands.split(',').forEach(b => {
                const opt = document.createElement('option');
                opt.value = b.trim(); opt.innerText = b.trim();
                select.appendChild(opt);
            });
        }

        startRealtimeCounter();
    }

    function startRealtimeCounter() {
        const my = getMY();
        const ref = db.ref('submissions/' + user.id + '/' + my);
        if (unsubscribe) unsubscribe();
        unsubscribe = ref.on('value', (snap) => updateStats(snap.numChildren()));
    }

    function updateStats(count) {
        const target = parseInt(user.target) || 0;
        document.getElementById('submittedCount').innerText = count;
        const remaining = Math.max(0, target - count);
        document.getElementById('remainingCount').innerText = remaining;
        const pct = target > 0 ? Math.min(100, Math.round((count / target) * 100)) : 0;
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressPct').innerText = pct + '%';
        const badge = document.getElementById('goalBadge');
        if (target > 0 && count >= target) badge.classList.add('show');
        else badge.classList.remove('show');
    }

    function refreshStatus() {
        const btn = event.target;
        btn.disabled = true; btn.innerText = '⏳ রিফ্রেশ হচ্ছে...';
        const my = getMY();
        db.ref('submissions/' + user.id + '/' + my).once('value').then(snap => {
            updateStats(snap.numChildren());
            btn.disabled = false; btn.innerText = '🔄 স্ট্যাটাস রিফ্রেশ করুন';
        });
    }

    async function submitData() {
        const phone = document.getElementById('customer_phone').value.trim();
        const brand = document.getElementById('brand_select').value;
        const name = document.getElementById('consumer_name').value.trim();
        const my = getMY();

        if (phone.length < 11 || !phone.startsWith('01'))
            return showError('submitError','submitErrorMsg','সঠিক ১১ সংখ্যার বাংলাদেশি নম্বর দিন (01 দিয়ে শুরু)');
        if (!brand)
            return showError('submitError','submitErrorMsg','ব্র্যান্ড নির্বাচন করুন');

        const btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.innerText = '⏳ যাচাই করা হচ্ছে...';

        // Duplicate check across all retailers for this month
        try {
            const allSnap = await db.ref('submissions').once('value');
            const allData = allSnap.val();
            let isDuplicate = false;

            if (allData) {
                outer: for (let rID in allData) {
                    const monthData = allData[rID][my];
                    if (monthData) {
                        for (let entryID in monthData) {
                            if (monthData[entryID].phone === phone) {
                                isDuplicate = true; break outer;
                            }
                        }
                    }
                }
            }

            if (isDuplicate) {
                showError('submitError','submitErrorMsg','এই নম্বরটি এই মাসে ইতিমধ্যে জমা করা হয়েছে!');
                btn.disabled = false; btn.innerText = '✅ জমা দিন';
                return;
            }

            await db.ref('submissions/' + user.id + '/' + my).push({
                phone,
                brand,
                consumer_name: name,
                time: new Date().toLocaleString('bn-BD')
            });

            sessionSubmits++;
            document.getElementById('sessionCount').innerText = sessionSubmits;
            document.getElementById('customer_phone').value = '';
            document.getElementById('consumer_name').value = '';
            btn.innerText = '✅ সফলভাবে জমা হয়েছে!';
            setTimeout(() => { btn.disabled = false; btn.innerText = '✅ জমা দিন'; }, 2000);

        } catch(e) {
            showError('submitError','submitErrorMsg','ত্রুটি: ' + e.message);
            btn.disabled = false; btn.innerText = '✅ জমা দিন';
        }
    }

    function getMY() {
        const d = new Date();
        return String(d.getMonth() + 1).padStart(2, '0') + '-' + d.getFullYear();
    }

    function logout() {
        localStorage.removeItem('retailerUser');
        if (unsubscribe) { db.ref('submissions').off('value', unsubscribe); }
        location.reload();
    }

    // Enter key support on login
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !document.getElementById('loginPage').classList.contains('hidden')) {
            login();
        }
    });
</script>
</body>
</html>
