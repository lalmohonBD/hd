<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>রিটেইলার পোর্টাল</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --blue: #2563eb; --blue-dark: #1d4ed8; --blue-light: #eff6ff;
            --green: #0d9f6e; --green-light: #e6f9f2;
            --red: #e53935; --red-light: #fdecea;
            --amber-light: #fffbeb;
            --card: #ffffff; --border: #e2e8f0;
            --text: #1e293b; --text-2: #475569; --text-3: #94a3b8;
            --radius: 16px; --radius-sm: 10px;
        }
        body { font-family: 'Hind Siliguri', sans-serif; background: #f4f6fb; min-height: 100vh; color: var(--text); }
        .hidden { display: none !important; }

        /* LOADING */
        #loadingScreen {
            position: fixed; inset: 0; z-index: 9999;
            background: linear-gradient(135deg, #dbeafe 0%, #eff6ff 45%, #fef9f0 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
            transition: opacity 0.25s;
        }
        .spinner { width: 44px; height: 44px; border: 4px solid #bfdbfe; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* LOGIN */
        #loginPage {
            min-height: 100vh;
            background: linear-gradient(135deg, #dbeafe 0%, #eff6ff 45%, #fef9f0 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 16px;
        }
        .login-outer { width: 100%; max-width: 400px; }
        .login-brand { text-align: center; margin-bottom: 28px; }
        .home-icon {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px; box-shadow: 0 8px 24px rgba(37,99,235,0.30);
        }
        .login-brand h1 { font-size: 26px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
        .login-brand p { font-size: 14px; color: var(--text-3); }
        .login-card { background: #fff; border-radius: 20px; box-shadow: 0 8px 32px rgba(30,41,59,0.10); padding: 28px 24px; }

        /* FORM */
        .field { margin-bottom: 14px; }
        .field label { display: block; font-size: 14px; font-weight: 600; color: var(--text-2); margin-bottom: 8px; }
        .inp {
            width: 100%; padding: 13px 16px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
            font-size: 15px; font-family: inherit; color: var(--text); background: #f8fafc; outline: none;
            transition: border 0.2s, box-shadow 0.2s; -webkit-appearance: none;
        }
        .inp:focus { border-color: var(--blue); background: #fff; box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
        select.inp { cursor: pointer; }
        .btn-login {
            width: 100%; padding: 14px; background: var(--blue); color: #fff; border: none;
            border-radius: 12px; font-size: 17px; font-weight: 700; font-family: inherit;
            cursor: pointer; margin-top: 6px; transition: background 0.2s, transform 0.15s;
        }
        .btn-login:hover:not(:disabled) { background: var(--blue-dark); }
        .btn-login:disabled { background: #93c5fd; cursor: not-allowed; }

        /* ERROR */
        .error-box {
            display: none; background: var(--red-light); border: 1px solid #fca5a5;
            border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px;
            color: var(--red); margin-bottom: 12px; font-weight: 600; align-items: center; gap: 8px;
        }
        .error-box.show { display: flex; }

        /* DASHBOARD */
        #dashPage { min-height: 100vh; display: flex; flex-direction: column; }
        .topbar {
            background: var(--blue); padding: 16px 18px 14px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
        }
        .topbar-title { color: #fff; font-size: 17px; font-weight: 700; }
        .topbar-sub { color: rgba(255,255,255,0.65); font-size: 12px; margin-top: 2px; }
        .logout-topbar {
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
            color: #fff; font-family: inherit; font-size: 13px; font-weight: 600;
            padding: 6px 14px; border-radius: 99px; cursor: pointer;
        }
        .dash-body { flex: 1; padding: 16px 16px 0; max-width: 440px; width: 100%; margin: 0 auto; }

        /* ANNOUNCE */
        .announce {
            background: var(--amber-light); border: 1.5px solid #fde68a; border-radius: var(--radius-sm);
            padding: 11px 14px; font-size: 13px; font-weight: 600; color: #92400e;
            display: flex; align-items: flex-start; gap: 8px; margin-bottom: 14px;
        }

        /* STATS */
        .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .stat-card { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 12px 8px 10px; text-align: center; }
        .stat-card .num { font-size: 26px; font-weight: 800; line-height: 1; }
        .stat-card .lbl { font-size: 11px; color: var(--text-3); margin-top: 4px; font-weight: 500; }
        .s-target .num { color: var(--blue); }
        .s-done .num { color: var(--green); }
        .s-rem .num { color: var(--red); }

        /* PROGRESS */
        .progress-wrap { margin-bottom: 16px; }
        .progress-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-3); margin-bottom: 6px; font-weight: 600; }
        .progress-bar { height: 8px; background: #e2e8f0; border-radius: 99px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--green), #34d399); border-radius: 99px; transition: width 0.6s ease; }
        .goal-badge { display: none; background: var(--green-light); border: 1px solid #6ee7b7; border-radius: 99px; padding: 4px 12px; font-size: 12px; font-weight: 700; color: var(--green); margin-top: 8px; text-align: center; }
        .goal-badge.show { display: block; }

        /* FORM CARD */
        .section-title { font-size: 12px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; margin: 16px 0 10px; }
        .form-card { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: 0 2px 8px rgba(30,41,59,0.06); }
        .divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
        .btn-submit {
            width: 100%; padding: 13px; background: var(--blue); color: #fff; border: none;
            border-radius: var(--radius-sm); font-size: 16px; font-weight: 700; font-family: inherit;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: background 0.2s, transform 0.15s; margin-top: 4px;
        }
        .btn-submit:hover:not(:disabled) { background: var(--blue-dark); }
        .btn-submit:disabled { background: var(--text-3); cursor: not-allowed; }

        /* BOTTOM */
        .session-count { display: inline-block; background: var(--blue-light); border-radius: 99px; padding: 6px 14px; font-size: 12px; font-weight: 700; color: var(--blue); margin-top: 10px; }
        .btn-refresh {
            width: 100%; padding: 11px; background: transparent; color: var(--text-2);
            border: 1.5px solid var(--border); border-radius: var(--radius-sm);
            font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; margin-top: 10px;
        }
        .btn-refresh:hover { background: #f1f5f9; }
        .btn-refresh:disabled { color: var(--text-3); cursor: not-allowed; }
        .bottom-bar {
            max-width: 440px; width: 100%; margin: 16px auto 0;
            padding: 14px 16px 32px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .version-tag { font-size: 12px; color: var(--text-3); }
        .version-tag span { color: var(--blue); font-weight: 700; }
        .btn-logout-bottom {
            background: transparent; color: var(--red); border: 1.5px solid #fca5a5;
            border-radius: 99px; font-family: inherit; font-size: 13px; font-weight: 600;
            padding: 6px 16px; cursor: pointer; transition: background 0.2s;
        }
        .btn-logout-bottom:hover { background: var(--red-light); }
    </style>
</head>
<body>

<!-- LOADING -->
<div id="loadingScreen">
    <div style="width:64px;height:64px;background:linear-gradient(135deg,#3b82f6,#2563eb);border-radius:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(37,99,235,0.30);">
        <svg viewBox="0 0 24 24" fill="white" width="34" height="34"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </div>
    <div class="spinner"></div>
    <div style="font-size:14px;color:#64748b;font-weight:600;">লোড হচ্ছে...</div>
</div>

<!-- LOGIN -->
<div id="loginPage" class="hidden">
    <div class="login-outer">
        <div class="login-brand">
            <div class="home-icon">
                <svg viewBox="0 0 24 24" fill="white" width="36" height="36"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            </div>
            <h1>রিটেইলার পোর্টাল</h1>
            <p>আপনার অ্যাকাউন্টে প্রবেশ করুন</p>
        </div>
        <div class="login-card">
            <div class="error-box" id="loginError"><span>⚠️</span><span id="loginErrorMsg"></span></div>
            <div class="field">
                <label>রিটেইলার আইডি</label>
                <input class="inp" type="text" id="r_id" placeholder="আপনার আইডি লিখুন" autocomplete="off">
            </div>
            <div class="field">
                <label>পাসওয়ার্ড</label>
                <input class="inp" type="password" id="r_pass" placeholder="পাসওয়ার্ড লিখুন">
            </div>
            <button class="btn-login" id="loginBtn" onclick="login()">লগইন করুন</button>
        </div>
        <div style="text-align:center;font-size:12px;color:#94a3b8;margin-top:20px;">
            © ২০২৬ রিটেইলার ম্যানেজমেন্ট সিস্টেম &nbsp;·&nbsp; <span style="color:#2563eb;font-weight:700;">v1.0.6</span>
        </div>
    </div>
</div>

<!-- DASHBOARD -->
<div id="dashPage" class="hidden">
    <div class="topbar">
        <div>
            <div class="topbar-title" id="welcomeName">স্বাগতম</div>
            <div class="topbar-sub" id="retailerIdShow">ID: —</div>
        </div>
        <button class="logout-topbar" onclick="logout()">লগআউট</button>
    </div>

    <div class="dash-body">
        <div class="announce" style="margin-top:14px;">
            <span style="font-size:16px;flex-shrink:0;">📣</span>
            <span id="announceText">স্বাগতম!</span>
        </div>

        <div class="stats-row">
            <div class="stat-card s-target"><div class="num" id="targetVal">0</div><div class="lbl">টার্গেট</div></div>
            <div class="stat-card s-done"><div class="num" id="submittedCount">0</div><div class="lbl">জমা হয়েছে</div></div>
            <div class="stat-card s-rem"><div class="num" id="remainingCount">0</div><div class="lbl">বাকি আছে</div></div>
        </div>

        <div class="progress-wrap">
            <div class="progress-meta"><span>অগ্রগতি</span><span id="progressPct">0%</span></div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
            <div class="goal-badge" id="goalBadge">🎉 লক্ষ্যমাত্রা অর্জিত!</div>
        </div>

        <div class="section-title">নতুন নম্বর জমা দিন</div>
        <div class="form-card">
            <div class="field">
                <label id="brandLabel">ব্র্যান্ড নির্বাচন করুন</label>
                <select class="inp" id="brand_select"></select>
            </div>
            <hr class="divider">
            <div class="field">
                <label>📱 মোবাইল নম্বর</label>
                <input class="inp" type="tel" id="customer_phone" placeholder="01XXXXXXXXX" maxlength="11">
            </div>
            <div class="field">
                <label>ভোক্তার নাম <span style="font-weight:400;color:#94a3b8">(ঐচ্ছিক)</span></label>
                <input class="inp" type="text" id="consumer_name" placeholder="ভোক্তার নাম লিখুন">
            </div>
            <div class="error-box" id="submitError"><span>⚠️</span><span id="submitErrorMsg"></span></div>
            <button class="btn-submit" id="submitBtn" onclick="submitData()">✅ জমা দিন</button>
        </div>

        <div style="text-align:center;">
            <span class="session-count">✅ এই সেশনে জমা হয়েছে <span id="sessionCount">0</span></span>
        </div>

        <button class="btn-refresh" id="refreshBtn" onclick="refreshAll()">🔄 সব রিফ্রেশ করুন</button>
    </div>

    <!-- BOTTOM BAR -->
    <div class="bottom-bar">
        <div class="version-tag">© ২০২৬ রিটেইলার ম্যানেজমেন্ট সিস্টেম &nbsp;·&nbsp; <span>v1.0.6</span></div>
        <button class="btn-logout-bottom" onclick="logout()">লগআউট</button>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://retailer-app-live-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let user = null, sessionSubmits = 0, submissionListener = null;

    function hideLoading() {
        const el = document.getElementById('loadingScreen');
        if (!el) return;
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 250);
    }

    function show(id) {
        ['loginPage','dashPage'].forEach(p => document.getElementById(p).classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function showError(boxId, msgId, msg) {
        const box = document.getElementById(boxId);
        document.getElementById(msgId).innerText = msg;
        box.classList.add('show');
        setTimeout(() => box.classList.remove('show'), 4000);
    }

    window.onload = () => {
        const saved = localStorage.getItem('retailerLogin');
        if (saved) {
            try {
                const c = JSON.parse(saved);
                fetchFreshAndShow(c.id, c.password);
            } catch(e) { localStorage.removeItem('retailerLogin'); hideLoading(); show('loginPage'); }
        } else { hideLoading(); show('loginPage'); }
    };

    function fetchFreshAndShow(id, password) {
        db.ref('retailers/' + id).once('value').then(snap => {
            const data = snap.val();
            if (data && String(data.password) === String(password)) {
                user = { ...data, id };
                hideLoading(); showDashboard();
            } else {
                localStorage.removeItem('retailerLogin');
                hideLoading(); show('loginPage');
            }
        }).catch(() => { hideLoading(); show('loginPage'); });
    }

    function login() {
        const id = document.getElementById('r_id').value.trim();
        const pass = document.getElementById('r_pass').value.trim();
        if (!id || !pass) return showError('loginError','loginErrorMsg','আইডি এবং পাসওয়ার্ড দিন');
        const btn = document.getElementById('loginBtn');
        btn.disabled = true; btn.innerText = '⏳ যাচাই করা হচ্ছে...';
        db.ref('retailers/' + id).once('value').then(snap => {
            const data = snap.val();
            if (data && String(data.password) === String(pass)) {
                user = { ...data, id };
                localStorage.setItem('retailerLogin', JSON.stringify({ id, password: pass }));
                showDashboard();
            } else {
                showError('loginError','loginErrorMsg','ভুল আইডি বা পাসওয়ার্ড।');
                btn.disabled = false; btn.innerText = 'লগইন করুন';
            }
        }).catch(err => {
            showError('loginError','loginErrorMsg','সংযোগ ত্রুটি: ' + err.message);
            btn.disabled = false; btn.innerText = 'লগইন করুন';
        });
    }

    function showDashboard() {
        show('dashPage');
        renderUI();
        // Fresh fetch from Firebase
        db.ref('retailers/' + user.id).once('value').then(snap => {
            const fresh = snap.val();
            if (fresh) { user = { ...fresh, id: user.id }; renderUI(); }
        });
        startRealtimeCounter();
    }

    function renderUI() {
        document.getElementById('welcomeName').innerText = user.name || user.id;
        document.getElementById('retailerIdShow').innerText = 'ID: ' + user.id;
        document.getElementById('announceText').innerText = user.announce || 'স্বাগতম!';
        document.getElementById('targetVal').innerText = user.target || 0;
        document.getElementById('brandLabel').innerText = user.fieldLabel || 'ব্র্যান্ড নির্বাচন করুন';
        const select = document.getElementById('brand_select');
        const prev = select.value;
        select.innerHTML = '<option value="">নির্বাচন করুন</option>';
        if (user.brands) {
            user.brands.split(',').forEach(b => {
                const opt = document.createElement('option');
                opt.value = b.trim(); opt.innerText = b.trim();
                select.appendChild(opt);
            });
        }
        if (prev) select.value = prev;
    }

    function startRealtimeCounter() {
        if (submissionListener) db.ref('submissions/' + user.id + '/' + getMY()).off('value', submissionListener);
        submissionListener = db.ref('submissions/' + user.id + '/' + getMY()).on('value', snap => updateStats(snap.numChildren()));
    }

    function updateStats(count) {
        const target = parseInt(user.target) || 0;
        document.getElementById('submittedCount').innerText = count;
        document.getElementById('remainingCount').innerText = Math.max(0, target - count);
        const pct = target > 0 ? Math.min(100, Math.round((count / target) * 100)) : 0;
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressPct').innerText = pct + '%';
        const badge = document.getElementById('goalBadge');
        if (target > 0 && count >= target) badge.classList.add('show');
        else badge.classList.remove('show');
    }

    function refreshAll() {
        const btn = document.getElementById('refreshBtn');
        btn.disabled = true; btn.innerText = '⏳ রিফ্রেশ হচ্ছে...';
        Promise.all([
            db.ref('retailers/' + user.id).once('value'),
            db.ref('submissions/' + user.id + '/' + getMY()).once('value')
        ]).then(([rSnap, sSnap]) => {
            const fresh = rSnap.val();
            if (fresh) { user = { ...fresh, id: user.id }; renderUI(); }
            updateStats(sSnap.numChildren());
            btn.disabled = false; btn.innerText = '🔄 সব রিফ্রেশ করুন';
        }).catch(() => { btn.disabled = false; btn.innerText = '🔄 সব রিফ্রেশ করুন'; });
    }

    async function submitData() {
        const phone = document.getElementById('customer_phone').value.trim();
        const brand = document.getElementById('brand_select').value;
        const name = document.getElementById('consumer_name').value.trim();
        const my = getMY();
        if (phone.length < 11 || !phone.startsWith('01'))
            return showError('submitError','submitErrorMsg','সঠিক ১১ সংখ্যার নম্বর দিন (01 দিয়ে শুরু)');
        if (!brand) return showError('submitError','submitErrorMsg','ব্র্যান্ড নির্বাচন করুন');
        const btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.innerText = '⏳ যাচাই করা হচ্ছে...';
        try {
            const allSnap = await db.ref('submissions').once('value');
            const allData = allSnap.val();
            let isDuplicate = false;
            if (allData) {
                outer: for (let rID in allData) {
                    const md = allData[rID][my];
                    if (md) for (let eid in md) { if (md[eid].phone === phone) { isDuplicate = true; break outer; } }
                }
            }
            if (isDuplicate) {
                showError('submitError','submitErrorMsg','এই নম্বরটি এই মাসে ইতিমধ্যে জমা করা হয়েছে!');
                btn.disabled = false; btn.innerText = '✅ জমা দিন'; return;
            }
            await db.ref('submissions/' + user.id + '/' + my).push({ phone, brand, consumer_name: name, time: new Date().toLocaleString('bn-BD') });
            sessionSubmits++;
            document.getElementById('sessionCount').innerText = sessionSubmits;
            document.getElementById('customer_phone').value = '';
            document.getElementById('consumer_name').value = '';
            btn.innerText = '✅ সফলভাবে জমা হয়েছে!';
            setTimeout(() => { btn.disabled = false; btn.innerText = '✅ জমা দিন'; }, 2000);
        } catch(e) {
            showError('submitError','submitErrorMsg','ত্রুটি: ' + e.message);
            btn.disabled = false; btn.innerText = '✅ জমা দিন';
        }
    }

    function getMY() { const d = new Date(); return String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear(); }
    function logout() { localStorage.removeItem('retailerLogin'); location.reload(); }
    document.addEventListener('keydown', e => { if (e.key==='Enter' && !document.getElementById('loginPage').classList.contains('hidden')) login(); });
</script>
